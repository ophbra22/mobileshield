name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # Contract tests run the web client's TypeScript response parser.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobileshield-web/package-lock.json
      - run: npm ci
        working-directory: mobileshield-web
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobileshield-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobileshield-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: cross-browser (Chromium, Firefox, WebKit; phone/tablet/desktop)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobileshield-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r ../requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobileshield-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8100
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-screenshots
          path: |
            mobileshield-web/test-results/
            mobileshield-web/playwright-report/
          retention-days: 14

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - run: npm audit --omit=dev --audit-level=high
        working-directory: mobileshield-web
